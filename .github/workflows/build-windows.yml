name: Build Windows Installer

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v3
        with:
          version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: target

      - name: Install front-end dependencies
        run: pnpm install --frozen-lockfile

      # Le fork n'a pas de clé de signature d'updater : on la désactive
      # via un override de config au lieu de la retirer de tauri.conf.json.
      - name: Build the app (Windows x64)
        run: pnpm tauri build --target x86_64-pc-windows-msvc --config '{"bundle":{"createUpdaterArtifacts":false}}'
        env:
          CI: false

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: BongoCat-windows-x64-installer
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
