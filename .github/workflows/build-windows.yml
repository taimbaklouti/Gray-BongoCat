name: Build Windows Installer

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # Épinglé au majeur vérifié en local (lockfile v9, pnpm 10.19) :
          # `latest` flottant peut basculer de majeur et casser --frozen-lockfile.
          version: 10
          run_install: false

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # Requiert pnpm/action-setup AVANT (ordre ci-dessus).
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Windows target
        # windows-latest l'a déjà en host, mais on blinde contre
        # un changement d'image (innoffensif si déjà installé).
        run: rustup target add x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install front-end dependencies
        run: pnpm install --frozen-lockfile

      # Le fork n'a pas de clé de signature d'updater : on la désactive
      # via un override de config au lieu de la retirer de tauri.conf.json.
      - name: Build the app (Windows x64)
        run: pnpm tauri build --target x86_64-pc-windows-msvc --config '{"bundle":{"createUpdaterArtifacts":false}}'
        env:
          CI: false

      - name: Verify bundle output
        # Garde : log lisible du contenu NSIS avant l'upload
        # (upload-artifact échoue déjà si vide via if-no-files-found).
        run: Get-ChildItem -Recurse src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: BongoCat-windows-x64-installer
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
